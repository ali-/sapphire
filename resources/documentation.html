header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}.brand{font-weight:650}header button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}

main{max-width:1000px;padding:40px clamp(22px,5vw,70px) 80px}h1{font-size:30px;line-height:1.25;margin:0 0 10px}h2{font-size:18px;margin:30px 0 8px}p{margin:8px 0 16px}.description{font-size:16px;max-width:780px}.definition{font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow:auto;background:var(--code);padding:13px 15px;border-radius:6px;margin:8px 0 18px}.parameter{padding:10px 0}.parameter-head{display:flex;align-items:center;gap:8px}code,.parameter-type{font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.parameter-type{background:var(--type);color:var(--muted);padding:3px 7px;border-radius:4px}.parameter p{font-size:14px;color:var(--muted);margin:5px 0 0}.parameter hr{border:0;border-top:1px solid var(--line);margin:10px 0 0}.content[hidden]{display:none}.note{background:var(--panel);border-left:3px solid var(--link);padding:10px 13px}.overview-links{padding-left:20px}.overview-links li{margin:5px 0}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:28px 20px 60px}header{padding:0 16px}}

const nav=document.getElementById("nav"),main=document.getElementById("main");
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined){if(tag==="p"){let last=0;for(const match of text.matchAll(/\.(?:wav|s3a|s3d|png)\b/g)){e.append(document.createTextNode(text.slice(last,match.index)),element("code","",match[0]));last=match.index+match[0].length}e.append(document.createTextNode(text.slice(last)))}else e.textContent=text}return e}
function show(index){const p=pages[index];main.replaceChildren();const article=element("article","content");article.append(element("h1","",p.title),element("p","description",p.description));if(p.params){article.append(element("h2","","Function"),element("pre","definition",p.signature),element("h2","","Parameters"));if(!p.params.length)article.append(element("p","muted","No parameters."));for(const row of p.params)appendRow(article,row)}if(p.lifecycleCode){article.append(element("h2","","Lifecycle"),element("p","","Create the scene and its objects, then pass the scene to App. App initializes objects and runs their lifecycle callbacks until the application closes."),element("pre","definition",p.lifecycleCode))}if(p.objectSupport){article.append(element("h2","","Object Support"));for(const row of p.objectSupport)appendRow(article,row)}if(p.members){article.append(element("h2","",p.label==="S3D Blender Exporter"?"Export Settings":"Members"));for(const row of p.members)appendRow(article,row)}if(p.lifecycle&&p.lifecycle.length){article.append(element("h2","","Lifecycle"));for(const row of p.lifecycle){article.append(element("h3","",row[0]),element("pre","definition",row[1]),element("p","",row[2]))}}if(p.types&&p.types.length){article.append(element("h2","",p.label==="Primitive"?"Types":"Type"));for(const row of p.types)appendRow(article,row)}if(p.example)article.append(element("h2","","Example"),element("pre","definition",p.example));if(index===0){article.append(element("h2","","Compiling"),element("p","","Place the Sapphire source in a sapphire folder alongside your game's game.cpp and CMakeLists.txt. Install SDL3 with its CMake package; the DirectX backend also requires the DirectX Shader Compiler headers and library."),element("p","","CMakeLists.txt:"),element("pre","definition",`cmake_minimum_required(VERSION 3.20)
project(game LANGUAGES CXX)

add_subdirectory(sapphire)
add_executable(game game.cpp)
target_link_libraries(game PRIVATE Sapphire::Sapphire)`),element("p","","Include Sapphire in game.cpp:"),element("pre","definition",`#include "sapphire/sapphire.cpp"`),backendInstructions(),element("pre","definition",`cmake -S . -B build -D backend=metal
cmake --build build`),element("p","","For Windows, replace metal with directx. Make sure SDL3 and the DirectX Shader Compiler runtime DLLs are available to the executable."))}main.append(article);document.querySelectorAll(".nav-item").forEach(b=>b.getAttribute("data-index")==index?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));history.replaceState(null,"","#"+p.id);window.scrollTo(0,0)}
function backendInstructions(){const p=element("p");p.append("Configure and build from the project directory. Use ",element("code","","metal")," for macOS or ",element("code","","directx")," for Windows:");return p}
function appendRow(parent,row){const section=element("section","parameter"),head=element("div","parameter-head");head.append(element("code","",row[0]),element("code","parameter-type",row[1]));section.append(head,element("p","",row[2]),document.createElement("hr"));parent.append(section)}
function buildNav(){const groups=new Map();pages.forEach((p,i)=>{let group=groups.get(p.group);if(!group){group=element("section","group");group.append(element("div","group-title",p.group));nav.append(group);groups.set(p.group,group)}const b=element("button","nav-item",p.label);b.type="button";b.dataset.index=i;b.addEventListener("click",()=>show(i));group.append(b)})}
buildNav();document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".nav-item").forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));document.querySelectorAll(".group").forEach(g=>g.hidden=!g.querySelector(".nav-item:not([hidden])"))});
